<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All work | Nexus Media Labs</title><link rel="stylesheet" href="assets/auth.css"></head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="index.html"><span class="mark">N</span><span>NEXUS<small>MEDIA LABS</small></span></a>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <h1>Everyone's work</h1>
  <p class="muted">Admin view: all work uploaded by all users.</p>
  <div class="filters">
    <input id="q" type="search" placeholder="Search title or description">
    <select id="fu"><option value="">All users</option></select>
    <select id="fc"><option value="">All categories</option></select>
  </div>
  <div id="count" class="muted"></div>
  <div id="msg" class="alert"></div>
  <div id="list" class="works"></div>
</main>
<script src="assets/auth.js"></script><script src="assets/shop.js"></script><script src="assets/portfolio.js"></script>
<script>
var ALL = [];
function draw() {
  var q = $('q').value.trim().toLowerCase(), u = $('fu').value, c = $('fc').value;
  var list = ALL.filter(function (w) {
    return (!u || String(w.user_id) === u) && (!c || w.category === c) &&
      (!q || w.title.toLowerCase().indexOf(q) > -1 || (w.description || '').toLowerCase().indexOf(q) > -1 || w.owner_name.toLowerCase().indexOf(q) > -1);
  });
  $('count').textContent = list.length + ' of ' + ALL.length + ' work items';
  $('list').innerHTML = list.length ? list.map(function (w) {
    return workCard(w, { owner: true }).replace('</article>', '<div class="acts"><a class="btn ghost sm" href="view.html?id=' + w.user_id + '">View ' + esc(w.owner_name.split(' ')[0]) + '\'s portfolio</a></div></article>');
  }).join('') : '<div class="empty" style="grid-column:1/-1">No work found.</div>';
}
['q', 'fu', 'fc'].forEach(function (id) { $(id).addEventListener('input', draw); });
(async function () {
  var me = await whoami();
  if (!me.ok || !me.user) { location.replace('login.html?as=admin'); return; }
  if (me.user.role !== 'admin') { location.replace('dashboard.html'); return; }
  buildNav(me.user, 0);
  var r = await call('all_work.php');
  if (!r.ok) { showMsg('msg', r.error); return; }
  ALL = r.works;
  var seen = {};
  ALL.forEach(function (w) { if (!seen[w.user_id]) { seen[w.user_id] = w.owner_name; } });
  $('fu').innerHTML += Object.keys(seen).map(function (k) { return '<option value="' + k + '">' + esc(seen[k]) + '</option>'; }).join('');
  $('fc').innerHTML += r.categories.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  draw();
})();
</script></body></html>
